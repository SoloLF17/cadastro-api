<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>Clientes — Cadastro</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17231e;background:#f5f7f4;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
    .topbar{background:#fff;border-bottom:1px solid #e5eae6}.topbar-inner{max-width:1180px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em}.brand-mark{width:35px;height:35px;display:grid;place-items:center;background:#176b50;color:#fff;border-radius:11px;font-size:18px}
    .nav-link{font-size:13px;color:#53645b;text-decoration:none;padding:9px 12px;border:1px solid #e5eae6;border-radius:9px}.nav-link:hover{color:#176b50;background:#f5f8f5}
    main{max-width:1180px;margin:0 auto;padding:42px 24px 64px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:27px}.eyebrow{color:#388467;text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:.12em;margin:0 0 9px}h1{font-size:clamp(28px,4vw,38px);letter-spacing:-.045em;margin:0 0 8px}.sub{color:#68766e;margin:0;font-size:15px}.stats{display:flex;gap:10px}.stat{background:#fff;border:1px solid #e6ebe7;padding:12px 17px;border-radius:12px;min-width:105px}.stat span{display:block;color:#748078;font-size:11px;margin-bottom:3px}.stat strong{font-size:21px;letter-spacing:-.03em}
    .layout{display:grid;grid-template-columns:330px 1fr;align-items:start;gap:20px}.card{background:#fff;border:1px solid #e4eae5;border-radius:16px;box-shadow:0 5px 18px #163c2810}.form-card{padding:22px;position:sticky;top:18px}.card-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.card-heading h2{font-size:16px;margin:0;letter-spacing:-.02em}.step{color:#8a978f;font-size:12px}.field{margin-bottom:15px}.field label{font-size:12px;font-weight:650;display:block;margin-bottom:7px;color:#3f4e46}.field input,.field select{width:100%;border:1px solid #dce4de;border-radius:9px;background:#fff;padding:11px 12px;color:#17231e;outline:none;transition:.15s}.field input:focus,.field select:focus{border-color:#328569;box-shadow:0 0 0 3px #32856920}.field input::placeholder{color:#a0aaa3}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;margin-top:20px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:680;font-size:13px;transition:transform .12s,background .12s}.btn:active{transform:scale(.98)}.primary{background:#176b50;color:white;flex:1}.primary:hover{background:#10573f}.secondary{background:#eef2ee;color:#536159}.secondary:hover{background:#e4ebe5}.hidden{display:none!important}
    .list-card{overflow:hidden}.list-head{padding:20px 22px;border-bottom:1px solid #edf0ed;display:flex;justify-content:space-between;align-items:center;gap:15px}.list-head h2{font-size:16px;margin:0 0 4px}.list-head p{font-size:12px;color:#7b877f;margin:0}.search{position:relative;width:min(230px,45%)}.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid #e0e6e1;border-radius:9px;outline:none;font-size:12px}.search input:focus{border-color:#328569}.search:before{content:'⌕';position:absolute;left:12px;top:5px;color:#849087;font-size:19px}
    .table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{padding:12px 18px;background:#fafbfa;color:#839087;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:750}td{padding:15px 18px;border-top:1px solid #f0f2f0;font-size:13px;vertical-align:middle}tbody tr:hover{background:#fcfdfc}.person-name{font-weight:680;color:#23332b}.person-id{font-size:10px;color:#9aa39d;margin-top:4px}.email{color:#637168}.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:720;white-space:nowrap}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.active{background:#eaf5ee;color:#267349}.inactive{background:#f1f2f1;color:#78817b}.row-actions{display:flex;gap:6px}.icon-btn{border:1px solid #e5eae6;background:#fff;border-radius:7px;color:#59675f;padding:6px 8px;font-size:11px}.icon-btn:hover{background:#f1f6f2;color:#176b50}.icon-btn.delete:hover{background:#fff2ef;color:#be4c38;border-color:#f4d9d3}.empty,.loading{padding:52px 20px;text-align:center;color:#7c8981;font-size:13px}.empty-icon{font-size:25px;margin-bottom:8px}.notice{display:none;margin-bottom:17px;padding:11px 14px;border-radius:9px;font-size:13px}.notice.show{display:block}.notice.error{background:#fff1ef;color:#a33e30}.notice.success{background:#ebf6ee;color:#286c43}
    @media(max-width:800px){main{padding-top:30px}.layout{grid-template-columns:1fr}.form-card{position:static}.intro{align-items:start;flex-direction:column}.stats{width:100%}.stat{flex:1}}@media(max-width:520px){.topbar-inner{padding:14px 17px}main{padding:26px 15px 45px}.email-col{display:none}th,td{padding:12px 10px}.list-head{padding:17px}.form-card{padding:18px}.row-actions{flex-direction:column}.two-col{gap:9px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark">C</span> Cadastro de clientes</div><a class="nav-link" href="#pessoas">Pessoas cadastradas ↓</a></div></header>
  <main>
    <section class="intro"><div><p class="eyebrow">Painel de clientes</p><h1>Seus contatos, em ordem.</h1><p class="sub">Cadastre e gerencie as pessoas em um só lugar.</p></div><div class="stats"><div class="stat"><span>Total de pessoas</span><strong id="total">—</strong></div><div class="stat"><span>Ativas</span><strong id="active-total">—</strong></div></div></section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section class="layout">
      <form class="card form-card" id="person-form">
        <div class="card-heading"><h2 id="form-title">Nova pessoa</h2><span class="step" id="form-mode">Cadastro</span></div>
        <div class="field"><label for="name">Nome completo</label><input id="name" name="name" placeholder="Ex.: Maria Silva" required maxlength="120" autocomplete="name"></div>
        <div class="two-col"><div class="field"><label for="age">Idade</label><input id="age" name="age" type="number" min="0" max="150" placeholder="30" required></div><div class="field"><label for="is_active">Status</label><select id="is_active" name="is_active"><option value="true">Ativo</option><option value="false">Inativo</option></select></div></div>
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="nome@exemplo.com" required maxlength="254" autocomplete="email"></div>
        <div class="actions"><button class="btn primary" id="submit-button" type="submit">Cadastrar pessoa</button><button class="btn secondary hidden" id="cancel-button" type="button">Cancelar</button></div>
      </form>
      <section class="card list-card hidden" id="pessoas"><div class="list-head"><div><h2>Pessoas cadastradas</h2><p id="list-caption">Carregando registros…</p></div><label class="search"><input id="search" type="search" placeholder="Buscar pessoa…" aria-label="Buscar pessoa"></label></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th class="email-col">E-mail</th><th>Idade</th><th>Status</th><th>Ações</th></tr></thead><tbody id="people-list"><tr><td class="loading" colspan="5">Carregando pessoas…</td></tr></tbody></table></div></section>
    </section>
  </main>
  <script>
    const API = '/v1';
    const form = document.querySelector('#person-form');
    const list = document.querySelector('#people-list');
    const notice = document.querySelector('#notice');
    let people = [];
    let editingId = null;
    let noticeTimer;

    function showNotice(message, type = 'success') {
      notice.textContent = message;
      notice.className = `notice show ${type}`;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => notice.className = 'notice', 4500);
    }

    async function request(path, options = {}) {
      const response = await fetch(`${API}${path}`, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      if (!response.ok) {
        let detail = `Não foi possível concluir a operação (${response.status}).`;
        try {
          const body = await response.json();
          if (Array.isArray(body.detail)) detail = body.detail.map(item => item.msg).join('; ');
          else if (body.detail) detail = body.detail;
        } catch { /* mantém a mensagem padrão */ }
        throw new Error(detail);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function renderPeople() {
      const query = document.querySelector('#search').value.trim().toLocaleLowerCase('pt-BR');
      const filtered = people.filter(person => `${person.name} ${person.email}`.toLocaleLowerCase('pt-BR').includes(query));
      document.querySelector('#total').textContent = people.length;
      document.querySelector('#active-total').textContent = people.filter(person => person.is_active === 'ATIVO' || person.is_active === true).length;
      document.querySelector('#list-caption').textContent = query ? `${filtered.length} resultado(s)` : `${people.length} registro(s)`;
      if (!filtered.length) {
        list.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">${query ? '⌕' : '＋'}</div>${query ? 'Nenhuma pessoa encontrada.' : 'Ainda não há pessoas cadastradas.'}</div></td></tr>`;
        return;
      }
      list.innerHTML = filtered.map(person => {
        const active = person.is_active === 'ATIVO' || person.is_active === true;
        return `<tr>
          <td><div class="person-name">${escapeHtml(person.name)}</div></td>
          <td class="email email-col">${escapeHtml(person.email)}</td><td>${escapeHtml(person.age)} anos</td>
          <td><span class="status ${active ? 'active' : 'inactive'}">${active ? 'Ativo' : 'Inativo'}</span></td>
          <td><div class="row-actions"><button class="icon-btn" data-action="edit" data-id="${escapeHtml(person.id)}" aria-label="Editar ${escapeHtml(person.name)}">Editar</button><button class="icon-btn delete" data-action="delete" data-id="${escapeHtml(person.id)}" aria-label="Excluir ${escapeHtml(person.name)}">Excluir</button></div></td>
        </tr>`;
      }).join('');
    }

    async function loadPeople() {
      list.innerHTML = '<tr><td class="loading" colspan="5">Carregando pessoas…</td></tr>';
      try { people = await request('/persons'); renderPeople(); }
      catch (error) {
        list.innerHTML = `<tr><td colspan="5"><div class="empty">${escapeHtml(error.message)}<br><br><button class="btn secondary" id="retry">Tentar novamente</button></div></td></tr>`;
        document.querySelector('#list-caption').textContent = 'Falha ao carregar';
        document.querySelector('#retry')?.addEventListener('click', loadPeople);
      }
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.querySelector('#form-title').textContent = 'Nova pessoa';
      document.querySelector('#form-mode').textContent = 'Cadastro';
      document.querySelector('#submit-button').textContent = 'Cadastrar pessoa';
      document.querySelector('#cancel-button').classList.add('hidden');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      data.age = Number(data.age);
      data.is_active = data.is_active === 'true';
      const path = editingId ? `/people/${encodeURIComponent(editingId)}` : '/people';
      const method = editingId ? 'PUT' : 'POST';
      const submit = document.querySelector('#submit-button');
      submit.disabled = true;
      try {
        await request(path, { method, body: JSON.stringify(data) });
        showNotice(editingId ? 'Cadastro atualizado com sucesso.' : 'Pessoa cadastrada com sucesso.');
        resetForm();
        await loadPeople();
      } catch (error) { showNotice(error.message, 'error'); }
      finally { submit.disabled = false; }
    });

    document.querySelector('#cancel-button').addEventListener('click', resetForm);
    document.querySelector('#search').addEventListener('input', renderPeople);
    document.querySelector('.nav-link').addEventListener('click', event => {
      event.preventDefault();
      const peopleSection = document.querySelector('#pessoas');
      peopleSection.classList.remove('hidden');
      peopleSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    list.addEventListener('click', async event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const person = people.find(item => String(item.id) === button.dataset.id);
      if (!person) return;
      if (button.dataset.action === 'edit') {
        editingId = person.id;
        document.querySelector('#name').value = person.name;
        document.querySelector('#age').value = person.age;
        document.querySelector('#email').value = person.email;
        document.querySelector('#is_active').value = person.is_active === 'INATIVO' || person.is_active === false ? 'false' : 'true';
        document.querySelector('#form-title').textContent = 'Editar pessoa';
        document.querySelector('#form-mode').textContent = 'Edição';
        document.querySelector('#submit-button').textContent = 'Salvar alterações';
        document.querySelector('#cancel-button').classList.remove('hidden');
        document.querySelector('#name').focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      if (!window.confirm(`Excluir o cadastro de ${person.name}?`)) return;
      button.disabled = true;
      try {
        await request(`/people/${encodeURIComponent(person.id)}`, { method: 'DELETE' });
        if (editingId === person.id) resetForm();
        showNotice('Cadastro excluído com sucesso.');
        await loadPeople();
      } catch (error) { showNotice(error.message, 'error'); button.disabled = false; }
    });

    loadPeople();
  </script>
</body>
</html>
